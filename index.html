
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131d">
<title>Finora — Personal Finance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#10131d;--panel:#191e2b;--panel2:#202738;--text:#f4f6fb;--muted:#969fb3;--accent:#8b7cff;--green:#50d6a0;--red:#ff7085;--border:#30384b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:14px}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px}
.auth-card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:0 20px 70px #0003}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:23px;letter-spacing:-.7px}
.logo-mark{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#a59aff,#6e5bff);color:white;font-size:22px}
.subtle{color:var(--muted);line-height:1.65}
.auth-card h1{font-size:26px;margin:27px 0 7px}
.field{display:grid;gap:7px;margin:16px 0}
.field label{color:#c8cede;font-size:12px;font-weight:650}
.field input,.field select,.field textarea,.search-input{width:100%;border:1px solid var(--border);background:#111622;color:var(--text);border-radius:11px;padding:12px 13px;outline:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.primary,.secondary,.danger{border:0;border-radius:11px;padding:12px 15px;font-weight:700}
.primary{background:var(--accent);color:white}
.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--border)}
.danger{background:#572b3b;color:#ffdce3}
.full{width:100%}
.text-button{background:none;border:0;color:#b3aaff;padding:5px}
.notice{padding:12px 14px;border-radius:11px;margin:15px 0;line-height:1.6;background:#222b3b;color:#e4e8f3;border:1px solid var(--border)}
.notice.success{background:#12372e;color:#b8ffe0;border-color:#28644f}
.notice.error{background:#44232d;color:#ffd1da;border-color:#773746}
.app{max-width:1440px;margin:auto;padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:27px}
.top-actions{display:flex;align-items:center;gap:9px}
.icon-btn{width:43px;height:43px;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:13px;font-size:22px}
.user-chip{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.menu-wrap{position:relative}
.dropdown{position:absolute;right:0;top:51px;width:245px;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:7px;z-index:30;box-shadow:0 20px 50px #0008}
.dropdown button{display:block;text-align:left;width:100%;padding:12px;border:0;border-radius:9px;background:transparent;color:var(--text)}
.dropdown button:hover{background:var(--panel2)}
.dropdown .menu-label{padding:10px 12px 5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.3px}
.page-title{font-size:27px;letter-spacing:-.7px;margin:0 0 6px}
.page-subtitle{color:var(--muted);margin:0 0 23px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:19px;min-width:0}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:12px}
.stat-value{font-size:clamp(19px,2.2vw,27px);font-weight:800;letter-spacing:-.6px;overflow-wrap:anywhere}
.stat-foot{font-size:11px;color:var(--muted);margin-top:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
.card-head h3{font-size:15px;margin:0}
.card-head button{font-size:12px}
.amount-in{color:var(--green)}.amount-out{color:var(--red)}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:grid;gap:10px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0c}
.item:last-child{border-bottom:0}
.item-main{min-width:0}
.item-name{font-weight:650;overflow-wrap:anywhere}
.item-meta{font-size:11px;color:var(--muted);margin-top:5px}
.item-right{text-align:right;flex-shrink:0}
.progress{height:7px;background:#30384b;border-radius:99px;overflow:hidden;margin:11px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#8b7cff,#5eddb2);border-radius:99px}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 13px}
.form-grid .field{margin:8px 0 12px}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.empty{padding:25px 8px;text-align:center;color:var(--muted);line-height:1.7}
.pill{display:inline-block;border-radius:99px;background:#2a3043;color:#cbd1e2;padding:5px 9px;font-size:11px}
.tx-tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.tx-tools input,.tx-tools select{min-width:130px;flex:1;background:#111622;border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px}
.chart-bars{height:175px;display:flex;align-items:flex-end;gap:10px;padding:12px 0 0}
.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.bar{width:min(35px,80%);min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#a398ff,#6d5bff)}
.bar-label{font-size:10px;color:var(--muted)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:530px}
th,td{padding:13px 10px;text-align:left;border-bottom:1px solid #ffffff0d;font-size:12px}
th{color:var(--muted);font-weight:600}
td:last-child,th:last-child{text-align:right}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
footer{text-align:center;color:#697286;font-size:11px;padding:30px 0 12px}
@media(max-width:850px){.span-3,.span-4{grid-column:span 6}.span-5,.span-7,.span-8{grid-column:span 12}}
@media(max-width:560px){.app{padding:15px}.logo{font-size:20px}.logo-mark{width:37px;height:37px}.user-chip{display:none}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-12{grid-column:span 12}.stat-value{font-size:25px}.form-grid,.settings-grid{grid-template-columns:1fr}.auth-card{padding:23px}.page-title{font-size:24px}}
</style>
</head>
<body>
<section id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><div class="logo-mark">F</div>Finora</div>
    <p class="subtle">Kelola uangmu dengan lebih terarah.</p>
    <h1 id="authTitle">Selamat datang</h1>
    <p id="authDescription" class="subtle">Masuk untuk melanjutkan ke dashboard keuanganmu.</p>
    <div id="authNotice"></div>
    <form id="authForm">
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="nama@email.com" required></div>
      <div class="field"><label for="authPassword">Kata sandi</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="Minimal 6 karakter" required></div>
      <div class="field hidden" id="confirmPasswordField"><label for="confirmPassword">Ulangi kata sandi</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" placeholder="Ulangi kata sandi"></div>
      <button id="authSubmit" class="primary full" type="submit">Masuk</button>
    </form>
    <div class="row" style="margin-top:16px;flex-wrap:wrap">
      <button id="toggleAuth" class="text-button">Belum punya akun? Daftar</button>
      <button id="forgotPassword" class="text-button">Lupa kata sandi?</button>
    </div>
  </div>
</section>

<div id="appScreen" class="app hidden">
  <header class="topbar">
    <div class="logo"><div class="logo-mark">F</div>Finora</div>
    <div class="top-actions">
      <span id="userEmail" class="user-chip"></span>
      <div class="menu-wrap">
        <button id="menuButton" class="icon-btn" aria-label="Buka menu" aria-expanded="false">⋮</button>
        <nav id="mainMenu" class="dropdown hidden">
          <div class="menu-label">Menu utama</div>
          <button data-page="dashboard">⌂ &nbsp; Dashboard</button>
          <button data-page="transactions">⇄ &nbsp; Transaksi</button>
          <button data-page="wallets">▣ &nbsp; Dompet</button>
          <button data-page="budgets">◴ &nbsp; Anggaran</button>
          <button data-page="goals">◎ &nbsp; Target tabungan</button>
          <button data-page="reports">▥ &nbsp; Laporan</button>
          <div class="menu-label">Lainnya</div>
          <button data-page="settings">⚙ &nbsp; Pengaturan & backup</button>
          <button id="signOutButton">↪ &nbsp; Keluar akun</button>
        </nav>
      </div>
    </div>
  </header>
  <main id="mainContent"></main>
  <footer>Finora · Kelola keuangan dengan lebih bijak</footer>
</div>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://doqevpmqvhcnyffhmeia.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DFfi7L-5zCsznP3BcQBUDA_VLaHw9X2";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const main = $("mainContent");
const authScreen = $("authScreen");
const appScreen = $("appScreen");

let user = null;
let authMode = "login";
let currentPage = "dashboard";
let saveTimer = null;
let data = freshData();

function freshData() {
  return {
    transactions: [],
    wallets: [{id: makeId(), name:"Dompet utama", balance:0, color:"#8b7cff"}],
    budgets: [],
    goals: []
  };
}
function makeId() {
  return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}
function rupiah(n) {
  return new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(Number(n)||0);
}
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function dateLabel(date) {
  if (!date) return "-";
  return new Date(date+"T12:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}
function notice(el, message, type="") {
  el.innerHTML = `<div class="notice ${type}">${escapeHtml(message)}</div>`;
}
function clearNotice(el) { el.innerHTML = ""; }

function setAuthMode(mode) {
  authMode = mode;
  const isRegister = mode === "register";
  $("authTitle").textContent = isRegister ? "Buat akun Finora" : "Selamat datang";
  $("authDescription").textContent = isRegister
    ? "Daftar untuk mulai mengatur keuanganmu."
    : "Masuk untuk melanjutkan ke dashboard keuanganmu.";
  $("authSubmit").textContent = isRegister ? "Daftar akun" : "Masuk";
  $("confirmPasswordField").classList.toggle("hidden", !isRegister);
  $("confirmPassword").required = isRegister;
  $("toggleAuth").textContent = isRegister ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
  $("forgotPassword").classList.toggle("hidden", isRegister);
  clearNotice($("authNotice"));
}

$("toggleAuth").addEventListener("click", () => setAuthMode(authMode === "login" ? "register" : "login"));

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const submit = $("authSubmit");
  clearNotice($("authNotice"));

  if (authMode === "register" && password !== $("confirmPassword").value) {
    notice($("authNotice"), "Kata sandi dan konfirmasi kata sandi tidak sama.", "error");
    return;
  }

  submit.disabled = true;
  submit.textContent = "Memproses...";

  try {
    if (authMode === "register") {
      const {data: result, error} = await supabase.auth.signUp({
        email,
        password,
        options: {emailRedirectTo: window.location.origin}
      });
      if (error) throw error;

      if (result.session) {
        notice($("authNotice"), "Pendaftaran berhasil. Akun sudah aktif, silakan masuk.", "success");
        setAuthMode("login");
        $("authEmail").value = email;
        return;
      }

      $("authPassword").value = "";
      $("confirmPassword").value = "";
      setAuthMode("login");
      $("authEmail").value = email;
      notice($("authNotice"),
        "Pendaftaran berhasil! Periksa email Anda untuk verifikasi akun. Klik tautan verifikasi di email, lalu kembali ke Finora dan login menggunakan email serta kata sandi yang sama.",
        "success");
    } else {
      const {data: result, error} = await supabase.auth.signInWithPassword({email,password});
      if (error) {
        if (/email not confirmed/i.test(error.message)) {
          throw new Error("Email belum diverifikasi. Periksa inbox atau folder Spam, klik tautan verifikasi, lalu login kembali.");
        }
        throw error;
      }
      user = result.user;
      await boot();
    }
  } catch (error) {
    notice($("authNotice"), readableError(error), "error");
  } finally {
    submit.disabled = false;
    submit.textContent = authMode === "register" ? "Daftar akun" : "Masuk";
  }
});

$("forgotPassword").addEventListener("click", async () => {
  const email = $("authEmail").value.trim();
  if (!email) {
    notice($("authNotice"), "Masukkan email terlebih dahulu, lalu tekan Lupa kata sandi.", "error");
    return;
  }
  try {
    const {error} = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin
    });
    if (error) throw error;
    notice($("authNotice"), "Jika email tersebut terdaftar, tautan pemulihan kata sandi akan dikirim. Periksa inbox dan folder Spam.", "success");
  } catch (error) {
    notice($("authNotice"), readableError(error), "error");
  }
});

function readableError(error) {
  const msg = error?.message || "Terjadi kesalahan. Silakan coba lagi.";
  if (/invalid login credentials/i.test(msg)) return "Email atau kata sandi salah. Pastikan email sudah diverifikasi.";
  if (/user already registered/i.test(msg)) return "Email ini sudah terdaftar. Silakan masuk atau verifikasi email terlebih dahulu.";
  if (/password should be at least/i.test(msg)) return "Kata sandi terlalu pendek. Gunakan minimal 6 karakter.";
  if (/email rate limit exceeded/i.test(msg)) return "Terlalu banyak percobaan email. Tunggu beberapa saat sebelum mencoba lagi.";
  return msg;
}

async function boot() {
  if (!user) {
    authScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");
    return;
  }
  $("userEmail").textContent = user.email || "";
  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");
  await loadData();
  renderPage();
}

async function loadData() {
  try {
    const {data: row, error} = await supabase
      .from("finora_data")
      .select("payload")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (row && row.payload) {
      const saved = row.payload;
      data = {
        transactions: Array.isArray(saved.transactions) ? saved.transactions : [],
        wallets: Array.isArray(saved.wallets) ? saved.wallets : [],
        budgets: Array.isArray(saved.budgets) ? saved.budgets : [],
        goals: Array.isArray(saved.goals) ? saved.goals : []
      };
    } else {
      data = freshData();
      await saveData(true);
    }
  } catch (error) {
    console.error("Gagal memuat data:", error);
    alert("Data gagal dimuat. Periksa koneksi internet dan pengaturan Supabase. Detail: " + error.message);
    data = freshData();
  }
}

async function saveData(showError=false) {
  if (!user) return;
  try {
    const {error} = await supabase.from("finora_data").upsert({
      user_id: user.id,
      payload: data,
      updated_at: new Date().toISOString()
    }, {onConflict:"user_id"});
    if (error) throw error;
  } catch (error) {
    console.error("Gagal menyimpan:", error);
    if (showError) alert("Data gagal disimpan: " + error.message);
  }
}

function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => saveData(true), 350);
}
function changePage(page) {
  currentPage = page;
  $("mainMenu").classList.add("hidden");
  $("menuButton").setAttribute("aria-expanded","false");
  renderPage();
}
$("menuButton").addEventListener("click", () => {
  const menu = $("mainMenu");
  menu.classList.toggle("hidden");
  $("menuButton").setAttribute("aria-expanded", String(!menu.classList.contains("hidden")));
});
document.addEventListener("click", e => {
  if (!e.target.closest(".menu-wrap")) {
    $("mainMenu").classList.add("hidden");
    $("menuButton").setAttribute("aria-expanded","false");
  }
});
$("mainMenu").addEventListener("click", e => {
  const btn = e.target.closest("[data-page]");
  if (btn) changePage(btn.dataset.page);
});
$("signOutButton").addEventListener("click", async () => {
  $("mainMenu").classList.add("hidden");
  const {error} = await supabase.auth.signOut();
  if (error) alert(error.message);
});

function pageHeading(title, subtitle) {
  return `<h1 class="page-title">${escapeHtml(title)}</h1><p class="page-subtitle">${escapeHtml(subtitle)}</p>`;
}
function walletOptions(selected="") {
  return data.wallets.map(w => `<option value="${escapeHtml(w.id)}" ${w.id===selected?"selected":""}>${escapeHtml(w.name)}</option>`).join("");
}
function categoryOptions(selected="") {
  const categories = ["Makanan","Transportasi","Belanja","Tagihan","Gaji","Bisnis","Hiburan","Kesehatan","Pendidikan","Tabungan","Lainnya"];
  return categories.map(c => `<option ${c===selected?"selected":""}>${c}</option>`).join("");
}
function txTotals() {
  const income = data.transactions.filter(t=>t.type==="income").reduce((s,t)=>s+Number(t.amount),0);
  const expense = data.transactions.filter(t=>t.type==="expense").reduce((s,t)=>s+Number(t.amount),0);
  return {income,expense,net:income-expense};
}
function walletBalance(wallet) {
  const changes = data.transactions.filter(t=>t.walletId===wallet.id)
    .reduce((sum,t)=>sum+(t.type==="income"?1:-1)*Number(t.amount),0);
  return Number(wallet.balance||0)+changes;
}
function moneyStats() {
  return data.wallets.reduce((s,w)=>s+walletBalance(w),0);
}
function recentTransactions(limit=5) {
  return [...data.transactions].sort((a,b)=>(b.date||"").localeCompare(a.date||"")).slice(0,limit);
}
function transactionRow(t, withDelete=false) {
  const wallet = data.wallets.find(w=>w.id===t.walletId);
  return `<div class="item">
    <div class="item-main"><div class="item-name">${escapeHtml(t.name)}</div>
    <div class="item-meta">${escapeHtml(t.category||"Lainnya")} · ${dateLabel(t.date)}${wallet?" · "+escapeHtml(wallet.name):""}</div></div>
    <div class="item-right"><div class="${t.type==="income"?"amount-in":"amount-out"}" style="font-weight:750">${t.type==="income"?"+":"−"}${rupiah(t.amount)}</div>
    ${withDelete?`<button class="text-button small" data-action="delete-tx" data-id="${escapeHtml(t.id)}">Hapus</button>`:""}</div>
  </div>`;
}

function renderPage() {
  const pages = {
    dashboard: renderDashboard,
    transactions: renderTransactions,
    wallets: renderWallets,
    budgets: renderBudgets,
    goals: renderGoals,
    reports: renderReports,
    settings: renderSettings
  };
  (pages[currentPage] || renderDashboard)();
}

function renderDashboard() {
  const totals = txTotals();
  main.innerHTML = pageHeading("Dashboard","Ringkasan kondisi keuanganmu hari ini.") + `
  <div class="grid">
    <section class="card span-3"><div class="stat-label">Total saldo</div><div class="stat-value">${rupiah(moneyStats())}</div><div class="stat-foot">Gabungan semua dompet</div></section>
    <section class="card span-3"><div class="stat-label">Total pemasukan</div><div class="stat-value amount-in">${rupiah(totals.income)}</div><div class="stat-foot">Semua transaksi pemasukan</div></section>
    <section class="card span-3"><div class="stat-label">Total pengeluaran</div><div class="stat-value amount-out">${rupiah(totals.expense)}</div><div class="stat-foot">Semua transaksi pengeluaran</div></section>
    <section class="card span-3"><div class="stat-label">Sisa arus kas</div><div class="stat-value">${rupiah(totals.net)}</div><div class="stat-foot">Pemasukan dikurangi pengeluaran</div></section>
    <section class="card span-7"><div class="card-head"><h3>Transaksi terbaru</h3><button class="text-button" data-page="transactions">Lihat semua →</button></div>
      ${recentTransactions().length?recentTransactions().map(t=>transactionRow(t)).join(""):`<div class="empty">Belum ada transaksi.<br>Tambahkan transaksi pertamamu dari menu Transaksi.</div>`}
    </section>
    <section class="card span-5"><div class="card-head"><h3>Saldo dompet</h3><button class="text-button" data-page="wallets">Kelola →</button></div>
      ${data.wallets.length?data.wallets.map(w=>`<div class="item"><div class="item-main"><div class="item-name">${escapeHtml(w.name)}</div><div class="item-meta">Saldo saat ini</div></div><div class="item-right" style="font-weight:750">${rupiah(walletBalance(w))}</div></div>`).join(""):`<div class="empty">Belum ada dompet.</div>`}
    </section>
    <section class="card span-6"><div class="card-head"><h3>Anggaran</h3><button class="text-button" data-page="budgets">Kelola →</button></div>
      ${data.budgets.length?data.budgets.slice(0,4).map(b=>budgetSummary(b)).join(""):`<div class="empty">Buat anggaran untuk mengontrol pengeluaran.</div>`}
    </section>
    <section class="card span-6"><div class="card-head"><h3>Target tabungan</h3><button class="text-button" data-page="goals">Kelola →</button></div>
      ${data.goals.length?data.goals.slice(0,4).map(g=>goalSummary(g)).join(""):`<div class="empty">Buat target tabungan pertamamu.</div>`}
    </section>
  </div>`;
}

function renderTransactions() {
  main.innerHTML = pageHeading("Transaksi","Catat setiap pemasukan dan pengeluaran.") + `
  <div class="grid">
    <section class="card span-4"><div class="card-head"><h3>Tambah transaksi</h3></div>
      ${!data.wallets.length?`<div class="notice">Buat dompet terlebih dahulu di menu Dompet.</div>`:""}
      <form id="txForm">
        <div class="field"><label>Jenis transaksi</label><select name="type"><option value="expense">Pengeluaran</option><option value="income">Pemasukan</option></select></div>
        <div class="field"><label>Nama transaksi</label><input name="name" placeholder="Contoh: Makan siang" required maxlength="100"></div>
        <div class="field"><label>Nominal (Rp)</label><input name="amount" type="number" min="1" step="1" placeholder="50000" required></div>
        <div class="field"><label>Kategori</label><select name="category">${categoryOptions()}</select></div>
        <div class="field"><label>Dompet</label><select name="walletId" required>${walletOptions()}</select></div>
        <div class="field"><label>Tanggal</label><input name="date" type="date" value="${today()}" required></div>
        <button class="primary full" type="submit" ${!data.wallets.length?"disabled":""}>Simpan transaksi</button>
      </form>
    </section>
    <section class="card span-8"><div class="card-head"><h3>Riwayat transaksi</h3><span class="pill">${data.transactions.length} transaksi</span></div>
      <div class="tx-tools"><input id="txSearch" placeholder="Cari transaksi..."><select id="txFilter"><option value="all">Semua jenis</option><option value="income">Pemasukan</option><option value="expense">Pengeluaran</option></select></div>
      <div id="txList">${renderTxList()}</div>
    </section>
  </div>`;
  $("txForm").addEventListener("submit", async e=>{
    e.preventDefault();
    const f = new FormData(e.target);
    data.transactions.push({
      id:makeId(),type:f.get("type"),name:String(f.get("name")).trim(),
      amount:Number(f.get("amount")),category:f.get("category"),
      walletId:f.get("walletId"),date:f.get("date")
    });
    await saveData(true); renderTransactions();
  });
  $("txSearch").addEventListener("input",renderTxListInto);
  $("txFilter").addEventListener("change",renderTxListInto);
}
function renderTxList() {
  const list=[...data.transactions].sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  return list.length?list.map(t=>transactionRow(t,true)).join(""):`<div class="empty">Belum ada transaksi.</div>`;
}
function renderTxListInto() {
  const q=$("txSearch").value.toLowerCase();
  const type=$("txFilter").value;
  const list=[...data.transactions].filter(t=>(type==="all"||t.type===type)&&(`${t.name} ${t.category}`.toLowerCase().includes(q))).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  $("txList").innerHTML=list.length?list.map(t=>transactionRow(t,true)).join(""):`<div class="empty">Transaksi tidak ditemukan.</div>`;
}

function renderWallets() {
  main.innerHTML=pageHeading("Dompet","Atur rekening atau dompet dan saldo awalnya.")+`
  <div class="grid">
    <section class="card span-4"><div class="card-head"><h3>Tambah dompet</h3></div>
      <form id="walletForm">
        <div class="field"><label>Nama dompet</label><input name="name" placeholder="Contoh: Bank utama" required maxlength="50"></div>
        <div class="field"><label>Saldo awal (Rp)</label><input name="balance" type="number" min="0" step="1" value="0" required></div>
        <button class="primary full">Tambah dompet</button>
      </form>
    </section>
    <section class="card span-8"><div class="card-head"><h3>Dompet saya</h3><span class="pill">${data.wallets.length} dompet</span></div>
      ${data.wallets.length?data.wallets.map(w=>`<div class="item"><div class="item-main"><div class="item-name">${escapeHtml(w.name)}</div><div class="item-meta">Saldo awal: ${rupiah(w.balance)}</div></div><div class="item-right"><div style="font-weight:800">${rupiah(walletBalance(w))}</div><button class="text-button small" data-action="delete-wallet" data-id="${escapeHtml(w.id)}">Hapus</button></div></div>`).join(""):`<div class="empty">Belum ada dompet.</div>`}

  $("walletForm").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.target);
    data.wallets.push({id:makeId(),name:String(f.get("name")).trim(),balance:Number(f.get("balance")),color:"#8b7cff"});

}

function budgetSpent(b) {
  return data.transactions.filter(t=>t.type==="expense"&&t.category===b.category&&(!b.month||t.date?.startsWith(b.month))).reduce((s,t)=>s+Number(t.amount),0);
}
function budgetSummary(b) {
  const spent=budgetSpent(b), limit=Number(b.limit)||0, pct=limit?Math.min(100,spent/limit*100):0;
  return `<div class="item-main"><div class="row"><div class="item-name">${escapeHtml(b.category)}</div><span class="small muted">${Math.round(pct)}%</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="item-meta">${rupiah(spent)} dari ${rupiah(limit)}</div></div>`;
}
function renderBudgets() {
  main.innerHTML=pageHeading("Anggaran","Tentukan batas pengeluaran berdasarkan kategori.")+`
  <div class="grid">
    <section class="card span-4"><div class="card-head"><h3>Buat anggaran</h3></div>
      <form id="budgetForm">
        <div class="field"><label>Kategori</label><select name="category">${categoryOptions("Makanan")}</select></div>
        <div class="field"><label>Batas anggaran (Rp)</label><input name="limit" type="number" min="1" required placeholder="1000000"></div>
        <div class="field"><label>Bulan</label><input name="month" type="month" value="${today().slice(0,7)}" required></div>
        <button class="primary full">Simpan anggaran</button>
      </form>
    </section>
    <section class="card span-8"><div class="card-head"><h3>Anggaran saya</h3></div>
      ${data.budgets.length?data.budgets.map(b=>`<div class="item"><div style="flex:1;min-width:0">${budgetSummary(b)}<div class="item-meta">${escapeHtml(b.month||"Semua bulan")}</div></div><button class="text-button small" data-action="delete-budget" data-id="${escapeHtml(b.id)}">Hapus</button></div>`).join(""):`<div class="empty">Belum ada anggaran.</div>`}
    </section>
  </div>`;
  $("budgetForm").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.target);
    data.budgets.push({id:makeId(),category:f.get("category"),limit:Number(f.get("limit")),month:f.get("month")});
    await saveData(true);renderBudgets();
  });
}

function goalSummary(g) {
  const target=Number(g.target)||0, saved=Number(g.saved)||0, pct=target?Math.min(100,saved/target*100):0;
  return `<div class="item-main"><div class="row"><div class="item-name">${escapeHtml(g.name)}</div><span class="small muted">${Math.round(pct)}%</span></div><div class="progress"><div style="width:${pct}%"></div></div><div class="item-meta">${rupiah(saved)} dari ${rupiah(target)}${g.deadline?" · Target "+dateLabel(g.deadline):""}</div></div>`;
}
function renderGoals() {
  main.innerHTML=pageHeading("Target tabungan","Pantau progres menuju tujuan finansialmu.")+`
  <div class="grid">
    <section class="card span-4"><div class="card-head"><h3>Target baru</h3></div>
      <form id="goalForm">
        <div class="field"><label>Nama target</label><input name="name" required maxlength="80" placeholder="Contoh: Beli laptop"></div>
        <div class="field"><label>Target nominal (Rp)</label><input name="target" type="number" min="1" required></div>
        <div class="field"><label>Tabungan saat ini (Rp)</label><input name="saved" type="number" min="0" value="0" required></div>
        <div class="field"><label>Tanggal target (opsional)</label><input name="deadline" type="date"></div>
        <button class="primary full">Simpan target</button>
      </form>
    </section>
    <section class="card span-8"><div class="card-head"><h3>Target saya</h3></div>
      ${data.goals.length?data.goals.map(g=>`<div class="item"><div style="flex:1;min-width:0">${goalSummary(g)}<div class="form-actions"><button class="secondary small" data-action="add-goal" data-id="${escapeHtml(g.id)}">Tambah tabungan</button><button class="text-button small" data-action="delete-goal" data-id="${escapeHtml(g.id)}">Hapus</button></div></div></div>`).join(""):`<div class="empty">Belum ada target tabungan.</div>`}
    </section>
  </div>`;
  $("goalForm").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.target);
    data.goals.push({id:makeId(),name:String(f.get("name")).trim(),target:Number(f.get("target")),saved:Number(f.get("saved")),deadline:f.get("deadline")});
    await saveData(true);renderGoals();
  });
}

function renderReports() {
  const totals=txTotals();
  const monthly={};
  data.transactions.forEach(t=>{
    const m=(t.date||"").slice(0,7)||"Tanpa tanggal";
    if(!monthly[m])monthly[m]={income:0,expense:0};
    monthly[m][t.type]+=Number(t.amount);
  });
  const months=Object.keys(monthly).sort().slice(-6);
  const max=Math.max(1,...months.flatMap(m=>[monthly[m].income,monthly[m].expense]));
  main.innerHTML=pageHeading("Laporan","Lihat ringkasan arus kas dan aktivitas keuangan.")+`
  <div class="grid">
    <section class="card span-4"><div class="stat-label">Total pemasukan</div><div class="stat-value amount-in">${rupiah(totals.income)}</div></section>
    <section class="card span-4"><div class="stat-label">Total pengeluaran</div><div class="stat-value amount-out">${rupiah(totals.expense)}</div></section>
    <section class="card span-4"><div class="stat-label">Arus kas bersih</div><div class="stat-value">${rupiah(totals.net)}</div></section>
    <section class="card span-12"><div class="card-head"><h3>Arus kas per bulan</h3><span class="pill">6 bulan terakhir</span></div>
      ${months.length?`<div class="chart-bars">${months.map(m=>`<div class="bar-col"><div style="display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center"><div class="bar" title="Pemasukan: ${rupiah(monthly[m].income)}" style="height:${Math.max(3,monthly[m].income/max*100)}%;background:var(--green)"></div><div class="bar" title="Pengeluaran: ${rupiah(monthly[m].expense)}" style="height:${Math.max(3,monthly[m].expense/max*100)}%;background:var(--red)"></div></div><span class="bar-label">${escapeHtml(m.slice(5))}/${escapeHtml(m.slice(2,4))}</span></div>`).join("")}</div><div class="row small muted" style="margin-top:14px"><span>🟢 Pemasukan</span><span>🔴 Pengeluaran</span></div>`:`<div class="empty">Tambahkan transaksi untuk melihat laporan.</div>`}
    </section>
    <section class="card span-6"><div class="card-head"><h3>Pengeluaran per kategori</h3></div>
      ${renderCategorySummary()}
    </section>
    <section class="card span-6"><div class="card-head"><h3>Ekspor laporan</h3></div><p class="subtle">Unduh catatan transaksi untuk disimpan atau dibuka di spreadsheet.</p><button class="primary" data-action="export-csv">Ekspor CSV</button></section>
  </div>`;
}
function renderCategorySummary() {
  const sums={};
  data.transactions.filter(t=>t.type==="expense").forEach(t=>sums[t.category||"Lainnya"]=(sums[t.category||"Lainnya"]||0)+Number(t.amount));
  const list=Object.entries(sums).sort((a,b)=>b[1]-a[1]);
  return list.length?list.map(([name,value])=>`<div class="item"><div class="item-name">${escapeHtml(name)}</div><div style="font-weight:700">${rupiah(value)}</div></div>`).join(""):`<div class="empty">Belum ada pengeluaran.</div>`;
}

function renderSettings() {
  main.innerHTML=pageHeading("Pengaturan","Kelola akun dan salinan data Finora.")+`
  <div class="settings-grid">
    <section class="card"><div class="card-head"><h3>Akun</h3></div><div class="item"><div class="item-main"><div class="item-name">Email akun</div><div class="item-meta">${escapeHtml(user?.email||"-")}</div></div></div><div class="form-actions"><button class="secondary" data-action="password-reset">Kirim tautan reset password</button><button class="danger" id="settingsSignOut">Keluar akun</button></div></section>
    <section class="card"><div class="card-head"><h3>Backup data</h3></div><p class="subtle">Unduh backup JSON atau pulihkan data dari file backup Finora sebelumnya.</p><div class="form-actions"><button class="primary" data-action="export-json">Unduh backup JSON</button><label class="secondary" style="display:inline-flex;align-items:center;cursor:pointer">Pulihkan JSON<input id="restoreFile" type="file" accept=".json,application/json" hidden></label></div><div id="settingsNotice"></div></section>
    <section class="card"><div class="card-head"><h3>Ekspor transaksi</h3></div><p class="subtle">Unduh daftar transaksi dalam format CSV.</p><button class="secondary" data-action="export-csv">Ekspor CSV</button></section>
  </div>`;
  $("settingsSignOut").addEventListener("click",()=> $("signOutButton").click());
  $("restoreFile").addEventListener("change",async e=>{
    const file=e.target.files?.[0];if(!file)return;
    try{
      const imported=JSON.parse(await file.text());
      if(!imported||!Array.isArray(imported.transactions)||!Array.isArray(imported.wallets)||!Array.isArray(imported.budgets)||!Array.isArray(imported.goals))throw new Error("Struktur file backup tidak valid.");
      if(!confirm("Pulihkan backup? Data saat ini akan diganti."))return;
      data=imported;await saveData(true);renderPage();
      alert("Backup berhasil dipulihkan.");
    }catch(err){alert("Gagal memulihkan backup: "+err.message);}
    e.target.value="";
  });
}

main.addEventListener("click", async e => {
  const pageBtn=e.target.closest("[data-page]");
  if(pageBtn){changePage(pageBtn.dataset.page);return;}
  const btn=e.target.closest("[data-action]");
  if(!btn)return;
  const id=btn.dataset.id;
  switch(btn.dataset.action) {
    case "delete-tx":
      if(confirm("Hapus transaksi ini?")){data.transactions=data.transactions.filter(t=>t.id!==id);await saveData(true);renderPage();}
      break;
    case "delete-wallet":
      if(data.transactions.some(t=>t.walletId===id)){alert("Dompet ini masih memiliki transaksi. Hapus atau pindahkan transaksinya terlebih dahulu.");return;}
      if(data.wallets.length<=1){alert("Minimal harus ada satu dompet.");return;}
      if(confirm("Hapus dompet ini?")){data.wallets=data.wallets.filter(w=>w.id!==id);await saveData(true);renderPage();}
      break;
    case "delete-budget":
      if(confirm("Hapus anggaran ini?")){data.budgets=data.budgets.filter(b=>b.id!==id);await saveData(true);renderPage();}
      break;
    case "delete-goal":
      if(confirm("Hapus target tabungan ini?")){data.goals=data.goals.filter(g=>g.id!==id);await saveData(true);renderPage();}
      break;
    case "add-goal":{
      const goal=data.goals.find(g=>g.id===id);if(!goal)return;
      const amount=prompt("Berapa nominal tabungan yang ingin ditambahkan? (Rp)");
      if(amount===null)return;
      const n=Number(amount);
      if(!Number.isFinite(n)||n<=0){alert("Masukkan nominal yang valid.");return;}
      goal.saved=Number(goal.saved)+n;await saveData(true);renderPage();break;
    }
    case "export-csv": exportCSV();break;
    case "export-json": exportJSON();break;
    case "password-reset":{
      const {error}=await supabase.auth.resetPasswordForEmail(user.email,{redirectTo:window.location.origin});
      if(error)alert(error.message);else alert("Jika email dapat menerima reset password, tautan akan dikirim. Periksa inbox dan folder Spam.");
      break;
    }
  }
});

function downloadBlob(content,type,name) {
  const blob=new Blob([content],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function exportCSV() {
  const rows=[["Tanggal","Jenis","Nama","Kategori","Dompet","Nominal"]];
  data.transactions.forEach(t=>{
    const wallet=data.wallets.find(w=>w.id===t.walletId);
    rows.push([t.date,t.type,t.name,t.category,wallet?.name||"",t.amount]);
  });
  const csv=rows.map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\r\n");
  downloadBlob("\uFEFF"+csv,"text/csv;charset=utf-8","finora-transaksi.csv");
}
function exportJSON() {
  downloadBlob(JSON.stringify(data,null,2),"application/json","finora-backup.json");
}

supabase.auth.onAuthStateChange((event, session) => {
  if (event === "PASSWORD_RECOVERY") {
    const newPassword = prompt("Masukkan kata sandi baru (minimal 6 karakter):");
    if (newPassword && newPassword.length >= 6) {
      supabase.auth.updateUser({password:newPassword}).then(({error})=>{
        alert(error ? error.message : "Kata sandi berhasil diperbarui.");
      });
    } else if (newPassword !== null) {
      alert("Kata sandi minimal 6 karakter.");
    }
    return;
  }
  if (event === "SIGNED_OUT") {
    user=null;
    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    setAuthMode("login");
  }
});

(async function init() {
  const {data: sessionData, error} = await supabase.auth.getSession();
  if(error) console.error(error);
  user=sessionData?.session?.user||null;
  await boot();
})();
})();
</script>
