
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>Finora — Personal Finance</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#10131d;--panel:#191e2b;--panel2:#22293a;--text:#f4f6fb;--muted:#969fb3;--accent:#8b7cff;--green:#50d6a0;--red:#ff7085;--border:#30384b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,sans-serif;font-size:14px}
button,input,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:410px;background:var(--panel);border:1px solid var(--border);border-radius:22px;padding:27px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:23px}
.logo-mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(135deg,#a69bff,#6e5bff);font-size:23px}
h1{letter-spacing:-.6px}
.auth-card h1{font-size:26px;margin:27px 0 8px}
.subtle{color:var(--muted);line-height:1.65}
.field{display:grid;gap:7px;margin:15px 0}
.field label{font-size:12px;font-weight:650;color:#cbd1e2}
.field input,.field select{width:100%;padding:12px;background:#111622;border:1px solid var(--border);border-radius:11px;color:var(--text);outline:none}
.field input:focus,.field select:focus{border-color:var(--accent)}
.primary,.secondary,.danger{padding:12px 15px;border-radius:11px;font-weight:700}
.primary{border:0;background:var(--accent);color:white}
.secondary{border:1px solid var(--border);background:var(--panel2);color:var(--text)}
.danger{border:0;background:#572b3b;color:#ffdce3}
.full{width:100%}
.text-button{border:0;background:transparent;color:#b3aaff;padding:6px}
.notice{padding:12px 14px;margin:14px 0;border-radius:11px;background:#222b3b;border:1px solid var(--border);line-height:1.6}
.notice.success{background:#12372e;color:#b8ffe0;border-color:#28644f}
.notice.error{background:#44232d;color:#ffd1da;border-color:#773746}
.app{max-width:1440px;margin:auto;padding:22px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}
.top-actions{display:flex;align-items:center;gap:10px}
.user-chip{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px}
.menu-wrap{position:relative}
.icon-btn{width:45px;height:45px;display:grid;place-items:center;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:13px}
.hamburger{width:22px;display:flex;flex-direction:column;gap:5px}
.hamburger span{display:block;width:22px;height:2px;border-radius:3px;background:currentColor}
.dropdown{position:absolute;right:0;top:53px;width:245px;background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:7px;z-index:30;box-shadow:0 20px 50px #0008}
.dropdown button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:9px;background:transparent;color:var(--text)}
.dropdown button:hover{background:var(--panel2)}
.menu-label{padding:10px 12px 5px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1.3px}
.page-title{font-size:27px;margin:0 0 6px}
.page-subtitle{color:var(--muted);margin:0 0 23px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:15px}
.card{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:17px;padding:19px}
.span-3{grid-column:span 3}.span-4{grid-column:span 4}.span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-7{grid-column:span 7}.span-8{grid-column:span 8}.span-12{grid-column:span 12}
.stat-label{color:var(--muted);font-size:12px;margin-bottom:12px}
.stat-value{font-size:clamp(20px,2.2vw,27px);font-weight:800;overflow-wrap:anywhere}
.stat-foot{font-size:11px;color:var(--muted);margin-top:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
.card-head h3{font-size:15px;margin:0}
.muted{color:var(--muted)}.small{font-size:12px}
.amount-in{color:var(--green)}.amount-out{color:var(--red)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0c}
.item:last-child{border-bottom:0}
.item-main{min-width:0;flex:1}
.item-name{font-weight:650;overflow-wrap:anywhere}
.item-meta{font-size:11px;color:var(--muted);margin-top:5px}
.item-right{text-align:right;flex-shrink:0}
.progress{height:7px;background:#30384b;border-radius:99px;overflow:hidden;margin:11px 0}
.progress>div{height:100%;background:linear-gradient(90deg,#8b7cff,#5eddb2);border-radius:99px}
.empty{padding:25px 8px;text-align:center;color:var(--muted);line-height:1.7}
.pill{display:inline-block;border-radius:99px;background:#2a3043;color:#cbd1e2;padding:5px 9px;font-size:11px}
.tx-tools{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.tx-tools input,.tx-tools select{min-width:130px;flex:1;background:#111622;border:1px solid var(--border);color:var(--text);padding:10px;border-radius:10px}
.chart-bars{height:175px;display:flex;align-items:flex-end;gap:10px;padding-top:12px}
.bar-col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:8px}
.bar{width:min(35px,80%);min-height:3px;border-radius:6px 6px 2px 2px}
.bar-label{font-size:10px;color:var(--muted)}
.form-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
footer{text-align:center;color:#697286;font-size:11px;padding:30px 0 12px}
@media(max-width:850px){.span-3,.span-4{grid-column:span 6}.span-5,.span-7,.span-8{grid-column:span 12}}
@media(max-width:560px){.app{padding:15px}.logo{font-size:20px}.logo-mark{width:37px;height:37px}.user-chip{display:none}.span-3,.span-4,.span-5,.span-6,.span-7,.span-8,.span-12{grid-column:span 12}.form-grid,.settings-grid{grid-template-columns:1fr}.auth-card{padding:23px}}
</style>
</head>
<body>

<section id="authScreen" class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><div class="logo-mark">F</div>Finora</div>
    <p class="subtle">Kelola uangmu dengan lebih terarah.</p>
    <h1 id="authTitle">Selamat datang</h1>
    <p id="authDescription" class="subtle">Masuk untuk melanjutkan ke dashboard keuanganmu.</p>
    <div id="authNotice"></div>
    <form id="authForm">
      <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" placeholder="nama@email.com" required></div>
      <div class="field"><label for="authPassword">Kata sandi</label><input id="authPassword" type="password" minlength="6" autocomplete="current-password" placeholder="Minimal 6 karakter" required></div>
      <div class="field hidden" id="confirmPasswordField"><label for="confirmPassword">Ulangi kata sandi</label><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password"></div>
      <button id="authSubmit" class="primary full" type="submit">Masuk</button>
    </form>
    <div class="row" style="margin-top:16px;flex-wrap:wrap">
      <button id="toggleAuth" class="text-button" type="button">Belum punya akun? Daftar</button>
      <button id="forgotPassword" class="text-button" type="button">Lupa kata sandi?</button>
    </div>
  </div>
</section>

<div id="appScreen" class="app hidden">
  <header class="topbar">
    <div class="logo"><div class="logo-mark">F</div>Finora</div>
    <div class="top-actions">
      <span id="userEmail" class="user-chip"></span>
      <div class="menu-wrap">
        <button id="menuButton" class="icon-btn" aria-label="Buka menu" aria-expanded="false">
          <span class="hamburger" aria-hidden="true"><span></span><span></span><span></span></span>
        </button>
        <nav id="mainMenu" class="dropdown hidden">
          <div class="menu-label">Menu utama</div>
          <button data-page="dashboard">⌂ &nbsp; Dashboard</button>
          <button data-page="transactions">⇄ &nbsp; Transaksi</button>
          <button data-page="wallets">▣ &nbsp; Dompet</button>
          <button data-page="budgets">◴ &nbsp; Anggaran</button>
          <button data-page="goals">◎ &nbsp; Target tabungan</button>
          <button data-page="reports">▥ &nbsp; Laporan</button>
          <div class="menu-label">Lainnya</div>
          <button data-page="settings">⚙ &nbsp; Pengaturan & backup</button>
          <button id="signOutButton">↪ &nbsp; Keluar akun</button>
        </nav>
      </div>
    </div>
  </header>
  <main id="mainContent"></main>
  <footer>Finora · Kelola keuangan dengan lebih bijak</footer>
</div>

<script>
(() => {
"use strict";

const SUPABASE_URL = "https://doqevpmqvhcnyffhmeia.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DFfi7L-5zCsznP3BcQBUDA_VLaHw9X2";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const main = $("mainContent");
const authScreen = $("authScreen");
const appScreen = $("appScreen");

let user = null;
let authMode = "login";
let currentPage = "dashboard";
let transactionWalletFilter = "all";
let reportWalletFilter = "all";
let data = freshData();

function makeId() {
  return crypto.randomUUID ? crypto.randomUUID() :
    Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function freshData() {
  return {
    transactions: [],
    wallets: [{ id: makeId(), name: "Dompet utama", balance: 0 }],
    budgets: [],
    goals: []
  };
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));
}

function rupiah(n) {
  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(Number(n) || 0);
}

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function dateLabel(date) {
  return date
    ? new Date(date + "T12:00:00").toLocaleDateString("id-ID", {
        day: "numeric",
        month: "short",
        year: "numeric"
      })
    : "-";
}

function notice(el, message, type = "") {
  el.innerHTML = `<div class="notice ${type}">${escapeHtml(message)}</div>`;
}

function clearNotice(el) {
  el.innerHTML = "";
}

/* Nominal: keyboard angka, pemisah ribuan otomatis. */
function getNominal(value) {
  return Number(String(value ?? "").replace(/\D/g, "")) || 0;
}

function formatNominalInput(input) {
  const digits = input.value.replace(/\D/g, "");
  input.value = digits ? Number(digits).toLocaleString("id-ID") : "";
}

function setupNominalInputs(root = document) {
  root.querySelectorAll("input[data-nominal]").forEach(input => {
    if (input.dataset.nominalReady) return;
    input.dataset.nominalReady = "1";
    input.setAttribute("inputmode", "numeric");
    input.setAttribute("autocomplete", "off");
    input.addEventListener("input", () => formatNominalInput(input));
    if (input.value) formatNominalInput(input);
  });
}

function nominalInput(name, label, value = "", required = true) {
  return `<div class="field"><label>${escapeHtml(label)}</label><input name="${escapeHtml(name)}" type="text" data-nominal inputmode="numeric" pattern="[0-9.]*" value="${escapeHtml(value)}" placeholder="0" ${required ? "required" : ""}></div>`;
}

function refreshNominals() {
  setupNominalInputs(main);
}

function setAuthMode(mode) {
  authMode = mode;
  const reg = mode === "register";
  $("authTitle").textContent = reg ? "Buat akun Finora" : "Selamat datang";
  $("authDescription").textContent = reg
    ? "Daftar untuk mulai mengatur keuanganmu."
    : "Masuk untuk melanjutkan ke dashboard keuanganmu.";
  $("authSubmit").textContent = reg ? "Daftar akun" : "Masuk";
  $("confirmPasswordField").classList.toggle("hidden", !reg);
  $("confirmPassword").required = reg;
  $("toggleAuth").textContent = reg ? "Sudah punya akun? Masuk" : "Belum punya akun? Daftar";
  $("forgotPassword").classList.toggle("hidden", reg);
  clearNotice($("authNotice"));
}

$("toggleAuth").addEventListener("click", () =>
  setAuthMode(authMode === "login" ? "register" : "login")
);

function readableError(error) {
  const msg = error?.message || "Terjadi kesalahan. Silakan coba lagi.";
  if (/email not confirmed/i.test(msg)) return "Email belum diverifikasi. Periksa inbox atau folder Spam, klik tautan verifikasi, lalu login kembali.";
  if (/invalid login credentials/i.test(msg)) return "Email atau kata sandi salah. Pastikan email sudah diverifikasi.";
  if (/user already registered/i.test(msg)) return "Email ini sudah terdaftar. Silakan masuk atau verifikasi email terlebih dahulu.";
  if (/password should be at least/i.test(msg)) return "Kata sandi terlalu pendek. Gunakan minimal 6 karakter.";
  return msg;
}

$("authForm").addEventListener("submit", async e => {
  e.preventDefault();

  const email = $("authEmail").value.trim();
  const password = $("authPassword").value;
  const submit = $("authSubmit");

  clearNotice($("authNotice"));

  if (authMode === "register" && password !== $("confirmPassword").value) {
    notice($("authNotice"), "Kata sandi dan konfirmasi kata sandi tidak sama.", "error");
    return;
  }

  submit.disabled = true;
  submit.textContent = "Memproses...";

  try {
    if (authMode === "register") {
      const { data: result, error } = await supabase.auth.signUp({
        email,
        password,
        options: { emailRedirectTo: window.location.origin }
      });

      if (error) throw error;

      $("authPassword").value = "";
      $("confirmPassword").value = "";
      setAuthMode("login");
      $("authEmail").value = email;

      if (result.session) {
        notice($("authNotice"), "Pendaftaran berhasil. Akun sudah aktif, silakan login.", "success");
      } else {
        notice(
          $("authNotice"),
          "Pendaftaran berhasil! Periksa email Anda untuk verifikasi akun. Klik tautan verifikasi di email, lalu kembali ke Finora dan login menggunakan email serta kata sandi yang sama.",
          "success"
        );
      }
    } else {
      const { data: result, error } = await supabase.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      user = result.user;
      await boot();
    }
  } catch (error) {
    notice($("authNotice"), readableError(error), "error");
  } finally {
    submit.disabled = false;
    submit.textContent = authMode === "register" ? "Daftar akun" : "Masuk";
  }
});

$("forgotPassword").addEventListener("click", async () => {
  const email = $("authEmail").value.trim();

  if (!email) {
    notice($("authNotice"), "Masukkan email terlebih dahulu.", "error");
    return;
  }

  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin
    });

    if (error) throw error;

    notice(
      $("authNotice"),
      "Jika email terdaftar, tautan pemulihan akan dikirim. Periksa inbox dan folder Spam.",
      "success"
    );
  } catch (error) {
    notice($("authNotice"), readableError(error), "error");
  }
});

async function boot() {
  if (!user) {
    authScreen.classList.remove("hidden");
    appScreen.classList.add("hidden");
    return;
  }

  $("userEmail").textContent = user.email || "";
  authScreen.classList.add("hidden");
  appScreen.classList.remove("hidden");

  await loadData();
  renderPage();
}

async function loadData() {
  try {
    const { data: row, error } = await supabase
      .from("finora_data")
      .select("payload")
      .eq("user_id", user.id)
      .maybeSingle();

    if (error) throw error;

    if (row?.payload) {
      const p = row.payload;

      data = {
        transactions: Array.isArray(p.transactions) ? p.transactions : [],
        wallets: Array.isArray(p.wallets) ? p.wallets : [],
        budgets: Array.isArray(p.budgets) ? p.budgets : [],
        goals: Array.isArray(p.goals) ? p.goals : []
      };

      // Pastikan akun yang datanya belum memiliki dompet tetap mendapat dompet utama.
      if (data.wallets.length === 0) {
        data.wallets = [{ id: makeId(), name: "Dompet utama", balance: 0 }];
        await saveData(true);
      }
    } else {
      data = freshData();
      await saveData(true);
    }
  } catch (error) {
    console.error(error);
    alert("Data gagal dimuat. Periksa koneksi dan pengaturan Supabase: " + error.message);
    data = freshData();
  }
}

async function saveData(showError = false) {
  if (!user) return;

  try {
    const { error } = await supabase.from("finora_data").upsert({
      user_id: user.id,
      payload: data,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });

    if (error) throw error;
  } catch (error) {
    console.error(error);
    if (showError) alert("Data gagal disimpan: " + error.message);
  }
}

function changePage(page, walletFilter = null) {
  currentPage = page;
  if (page === "transactions" && walletFilter) transactionWalletFilter = walletFilter;
  $("mainMenu").classList.add("hidden");
  $("menuButton").setAttribute("aria-expanded", "false");
  renderPage();
}

$("menuButton").addEventListener("click", () => {
  const menu = $("mainMenu");
  menu.classList.toggle("hidden");
  $("menuButton").setAttribute("aria-expanded", String(!menu.classList.contains("hidden")));
});

document.addEventListener("click", e => {
  if (!e.target.closest(".menu-wrap")) {
    $("mainMenu").classList.add("hidden");
    $("menuButton").setAttribute("aria-expanded", "false");
  }
});

$("mainMenu").addEventListener("click", e => {
  const btn = e.target.closest("[data-page]");
  if (btn) changePage(btn.dataset.page);
});

$("signOutButton").addEventListener("click", async () => {
  const { error } = await supabase.auth.signOut();
  if (error) alert(error.message);
});

function heading(title, subtitle) {
  return `<h1 class="page-title">${escapeHtml(title)}</h1><p class="page-subtitle">${escapeHtml(subtitle)}</p>`;
}

/* Pilihan dompet otomatis mengikuti semua dompet milik user. */
function walletOptions(selected = "") {
  if (!Array.isArray(data.wallets) || data.wallets.length === 0) {
    return `<option value="">Belum ada dompet — buat dompet terlebih dahulu</option>`;
  }

  const selectedId = data.wallets.some(w => w.id === selected)
    ? selected
    : data.wallets[0].id;

  return data.wallets.map(w =>
    `<option value="${escapeHtml(w.id)}" ${w.id === selectedId ? "selected" : ""}>${escapeHtml(w.name)}</option>`
  ).join("");
}

function categoryOptions(selected = "Makanan") {
  return ["Makanan", "Transportasi", "Belanja", "Tagihan", "Gaji", "Bisnis", "Hiburan", "Kesehatan", "Pendidikan", "Tabungan", "Lainnya"]
    .map(c => `<option ${c === selected ? "selected" : ""}>${c}</option>`)
    .join("");
}

function totals() {
  const income = data.transactions
    .filter(t => t.type === "income")
    .reduce((s, t) => s + Number(t.amount), 0);

  const expense = data.transactions
    .filter(t => t.type === "expense")
    .reduce((s, t) => s + Number(t.amount), 0);

  return { income, expense, net: income - expense };
}

function walletBalance(w) {
  return Number(w.balance || 0) + data.transactions
    .filter(t => t.walletId === w.id)
    .reduce((s, t) => s + (t.type === "income" ? 1 : -1) * Number(t.amount), 0);
}

function totalBalance() {
  return data.wallets.reduce((s, w) => s + walletBalance(w), 0);
}

function txRow(t, withDelete = false) {
  const w = data.wallets.find(x => x.id === t.walletId);

  return `<div class="item">
    <div class="item-main">
      <div class="item-name">${escapeHtml(t.name)}</div>
      <div class="item-meta">${escapeHtml(t.category || "Lainnya")} · ${dateLabel(t.date)}${w ? " · " + escapeHtml(w.name) : ""}</div>
    </div>
    <div class="item-right">
      <div class="${t.type === "income" ? "amount-in" : "amount-out"}" style="font-weight:750">${t.type === "income" ? "+" : "−"}${rupiah(t.amount)}</div>
      ${withDelete ? `<button class="text-button small" data-action="delete-tx" data-id="${escapeHtml(t.id)}">Hapus</button>` : ""}
    </div>
  </div>`;
}

function renderPage() {
  const pages = {
    dashboard: renderDashboard,
    transactions: renderTransactions,
    wallets: renderWallets,
    budgets: renderBudgets,
    goals: renderGoals,
    reports: renderReports,
    settings: renderSettings
  };

  (pages[currentPage] || renderDashboard)();
  refreshNominals();
}

function budgetSpent(b) {
  return data.transactions
    .filter(t => t.type === "expense" && t.category === b.category && (!b.month || t.date?.startsWith(b.month)))
    .reduce((s, t) => s + Number(t.amount), 0);
}

function budgetSummary(b) {
  const spent = budgetSpent(b);
  const limit = Number(b.limit) || 0;
  const pct = limit ? Math.min(100, spent / limit * 100) : 0;

  return `<div class="item-main">
    <div class="row">
      <div class="item-name">${escapeHtml(b.category)}</div>
      <span class="small muted">${Math.round(pct)}%</span>
    </div>
    <div class="progress"><div style="width:${pct}%"></div></div>
    <div class="item-meta">${rupiah(spent)} dari ${rupiah(limit)}</div>
  </div>`;
}

function goalSummary(g) {
  const target = Number(g.target) || 0;
  const saved = Number(g.saved) || 0;
  const pct = target ? Math.min(100, saved / target * 100) : 0;

  return `<div class="item-main">
    <div class="row">
      <div class="item-name">${escapeHtml(g.name)}</div>

function walletTotals(walletId) {
  const list = data.transactions.filter(t => t.walletId === walletId);
  const income = list.filter(t => t.type === "income").reduce((sum, t) => sum + Number(t.amount || 0), 0);
  const expense = list.filter(t => t.type === "expense").reduce((sum, t) => sum + Number(t.amount || 0), 0);
  return { income, expense, net: income - expense, count: list.length };
}

function downloadBlob(content, type, name) {
  const blob = new Blob([content], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function exportCSV() {
  const rows = [["Tanggal", "Jenis", "Nama", "Kategori", "Dompet", "Nominal"]];

  data.transactions.forEach(t => {
    const w = data.wallets.find(x => x.id === t.walletId);
    rows.push([t.date, t.type, t.name, t.category, w?.name || "", t.amount]);
  });

  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
  downloadBlob("\uFEFF" + csv, "text/csv;charset=utf-8", "finora-transaksi.csv");
}

function exportJSON() {
  downloadBlob(JSON.stringify(data, null, 2), "application/json", "finora-backup.json");
}

main.addEventListener("click", async e => {
  const page = e.target.closest("[data-page]");
  if (page) {
    changePage(page.dataset.page, page.dataset.walletFilter || null);
    return;
  }

  const btn = e.target.closest("[data-action]");
  if (!btn) return;

  const id = btn.dataset.id;

  switch (btn.dataset.action) {
    case "delete-tx":
      if (confirm("Hapus transaksi ini?")) {
        data.transactions = data.transactions.filter(x => x.id !== id);
        await saveData(true);
        renderPage();
      }
      break;

    case "delete-wallet":
      if (data.transactions.some(x => x.walletId === id)) {
        alert("Dompet masih memiliki transaksi. Hapus atau pindahkan transaksinya terlebih dahulu.");
        return;
      }

      if (data.wallets.length <= 1) {
        alert("Minimal harus ada satu dompet.");
        return;
      }

      if (confirm("Hapus dompet ini?")) {
        data.wallets = data.wallets.filter(x => x.id !== id);
        await saveData(true);
        renderPage();
      }
      break;

    case "delete-budget":
      if (confirm("Hapus anggaran ini?")) {
        data.budgets = data.budgets.filter(x => x.id !== id);
        await saveData(true);
        renderPage();
      }
      break;

    case "delete-goal":
      if (confirm("Hapus target ini?")) {
        data.goals = data.goals.filter(x => x.id !== id);
        await saveData(true);
        renderPage();
      }
      break;

    case "add-goal": {
      const goal = data.goals.find(x => x.id === id);
      if (!goal) return;

      const value = prompt("Nominal tabungan yang ingin ditambahkan (angka saja):");
      if (value === null) return;

      const amount = getNominal(value);

      if (amount <= 0) {
        alert("Masukkan nominal yang valid.");
        return;
      }

      goal.saved = Number(goal.saved) + amount;
      await saveData(true);
      renderPage();
      break;
    }

    case "export-csv":
      exportCSV();
      break;

    case "export-json":
      exportJSON();
      break;

    case "password-reset": {
      const { error } = await supabase.auth.resetPasswordForEmail(user.email, {
        redirectTo: window.location.origin
      });

      if (error) alert(error.message);
      else alert("Jika email dapat menerima reset password, tautan akan dikirim. Periksa inbox dan folder Spam.");
      break;
    }
  }
});

supabase.auth.onAuthStateChange((event, session) => {
  if (event === "SIGNED_OUT") {
    user = null;
    appScreen.classList.add("hidden");
    authScreen.classList.remove("hidden");
    setAuthMode("login");
  }

  if (event === "PASSWORD_RECOVERY") {
    const newPassword = prompt("Masukkan kata sandi baru (minimal 6 karakter):");

    if (newPassword && newPassword.length >= 6) {
      supabase.auth.updateUser({ password: newPassword }).then(({ error }) => {
        alert(error ? error.message : "Kata sandi berhasil diperbarui.");
      });
    } else if (newPassword !== null) {
      alert("Kata sandi minimal 6 karakter.");
    }
  }
});

(async () => {
  const { data: sessionData, error } = await supabase.auth.getSession();

  if (error) console.error(error);

  user = sessionData?.session?.user || null;
  await boot();
})();
})();
</script>
</body>
</html>
