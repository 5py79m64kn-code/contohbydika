<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Voice Assistant</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.container{
    width:92%;
    max-width:430px;
    min-height:650px;
    padding:25px 20px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    background:rgba(10,15,35,.92);
    box-shadow:0 0 50px rgba(0,150,255,.15);
    display:flex;
    flex-direction:column;
    align-items:center;
}

.logo{
    width:90px;
    height:90px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    background:linear-gradient(145deg,#172554,#0f172a);
    box-shadow:0 0 35px rgba(0,170,255,.35);
    margin-top:10px;
}

h1{
    margin-top:18px;
    font-size:27px;
}

.subtitle{
    margin-top:7px;
    color:#94a3b8;
    font-size:14px;
}

.status{
    margin-top:25px;
    padding:10px 18px;
    border-radius:30px;
    background:#111827;
    color:#93c5fd;
    font-size:14px;
}

.orb{
    width:180px;
    height:180px;
    border-radius:50%;
    margin:35px 0 25px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#2563eb 0%,#172554 45%,#0b1025 72%);
    box-shadow:0 0 35px rgba(37,99,235,.4);
    transition:.3s;
}

.orb.listening{
    animation:pulse 1s infinite;
    box-shadow:0 0 70px rgba(0,170,255,.8);
}

@keyframes pulse{
    0%,100%{transform:scale(1)}
    50%{transform:scale(1.08)}
}

.mic{
    font-size:70px;
}

button{
    border:0;
    cursor:pointer;
}

.listenBtn{
    width:75px;
    height:75px;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:30px;
    box-shadow:0 8px 30px rgba(37,99,235,.4);
}

.listenBtn:active{
    transform:scale(.94);
}

.result{
    width:100%;
    margin-top:25px;
    padding:18px;
    border-radius:18px;
    background:#0f172a;
    border:1px solid rgba(255,255,255,.08);
    min-height:90px;
}

.label{
    color:#64748b;
    font-size:12px;
    margin-bottom:8px;
}

.text{
    font-size:16px;
    line-height:1.5;
}

.commands{
    width:100%;
    margin-top:18px;
}

.commands p{
    color:#64748b;
    font-size:12px;
    margin-bottom:8px;
}

.command-list{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.command{
    padding:7px 10px;
    border-radius:10px;
    background:#111827;
    color:#cbd5e1;
    font-size:11px;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">🤖</div>

    <h1>AI Assistant</h1>
    <div class="subtitle">Voice Command Assistant</div>

    <div class="status" id="status">
        Tekan mikrofon untuk mulai
    </div>

    <div class="orb" id="orb">
        <div class="mic">🎙️</div>
    </div>

    <button class="listenBtn" id="listenBtn">
        🎤
    </button>

    <div class="result">
        <div class="label">PERINTAH ANDA</div>
        <div class="text" id="userText">
            Belum ada perintah...
        </div>
    </div>

    <div class="result">
        <div class="label">AI</div>
        <div class="text" id="aiText">
            Silakan berikan perintah.
        </div>
    </div>

    <div class="commands">
        <p>Contoh perintah:</p>

        <div class="command-list">
            <div class="command">"Buka WhatsApp"</div>
            <div class="command">"Buka YouTube"</div>
            <div class="command">"Buka Google"</div>
            <div class="command">"Buka kamera"</div>
            <div class="command">"Nyalakan senter"</div>
            <div class="command">"Matikan senter"</div>
            <div class="command">"Jam berapa sekarang"</div>
        </div>
    </div>

</div>

<script>
const listenBtn = document.getElementById("listenBtn");
const statusText = document.getElementById("status");
const userText = document.getElementById("userText");
const aiText = document.getElementById("aiText");
const orb = document.getElementById("orb");

let recognition;
let stream = null;
let videoTrack = null;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if (!SpeechRecognition) {

    statusText.innerText =
        "Browser tidak mendukung voice recognition";

    aiText.innerText =
        "Coba gunakan Chrome atau browser yang mendukung Speech Recognition.";

} else {

    recognition = new SpeechRecognition();

    recognition.lang = "id-ID";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function(){

        statusText.innerText = "Mendengarkan...";
        orb.classList.add("listening");

        listenBtn.innerText = "⏹️";
    };

    recognition.onend = function(){

        statusText.innerText =
            "Tekan mikrofon untuk berbicara";

        orb.classList.remove("listening");

        listenBtn.innerText = "🎤";
    };

    recognition.onerror = function(event){

        statusText.innerText =
            "Terjadi kesalahan: " + event.error;

        orb.classList.remove("listening");

        listenBtn.innerText = "🎤";
    };

    recognition.onresult = function(event){

        const command =
            event.results[0][0].transcript
            .toLowerCase()
            .trim();

        userText.innerText = command;

        processCommand(command);
    };
}

listenBtn.addEventListener("click",function(){

    if(!recognition) return;

    try{
        recognition.start();
    }catch(e){
        console.log(e);
    }
});


function speak(text){

    if(!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech =
        new SpeechSynthesisUtterance(text);

    speech.lang = "id-ID";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}


function response(text){

    aiText.innerText = text;

    speak(text);
}


async function processCommand(command){

    /* WHATSAPP */

    if(
        command.includes("buka whatsapp") ||
        command.includes("buka wa")
    ){

        response("Baik, saya akan membuka WhatsApp.");

        setTimeout(function(){

            window.location.href =
                "https://wa.me/";

        },1000);

        return;
    }


    /* YOUTUBE */

    if(command.includes("buka youtube")){

        response("Baik, saya membuka YouTube.");

        setTimeout(function(){

            window.location.href =
                "https://youtube.com/";

        },1000);

        return;
    }


    /* GOOGLE */

    if(command.includes("buka google")){

        response("Baik, saya membuka Google.");

        setTimeout(function(){

            window.location.href =
                "https://google.com/";

        },1000);

        return;
    }


    /* GOOGLE SEARCH */

    if(
        command.startsWith("cari ") ||
        command.startsWith("search ")
    ){

        let query = command
            .replace("cari ","")
            .replace("search ","")
            .trim();

        if(query){

            response(
                "Baik, saya mencari " + query
            );

            setTimeout(function(){

                window.location.href =
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(query);

            },1000);

            return;
        }
    }


    /* CAMERA */

    if(
        command.includes("buka kamera") ||
        command.includes("nyalakan kamera")
    ){

        response(
            "Baik, saya mencoba membuka kamera."
        );

        await openCamera();

        return;
    }


    /* FLASHLIGHT ON */

    if(
        command.includes("nyalakan senter") ||
        command.includes("hidupkan senter") ||
        command.includes("senter nyala")
    ){

        await flashlight(true);

        return;
    }


    /* FLASHLIGHT OFF */

    if(
        command.includes("matikan senter") ||
        command.includes("padamkan senter") ||
        command.includes("senter mati")
    ){

        await flashlight(false);

        return;
    }


    /* TIME */

    if(
        command.includes("jam berapa") ||
        command.includes("sekarang jam berapa")
    ){

        const now = new Date();

        const time =
            now.toLocaleTimeString(
                "id-ID",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        response(
            "Sekarang pukul " + time
        );

        return;
    }


    /* GREETING */

    if(
        command.includes("halo") ||
        command.includes("hai") ||
        command.includes("hello")
    ){

        response(
            "Halo! Saya siap membantu. Silakan berikan perintah."
        );

        return;
    }


    /* HELP */

    if(
        command.includes("bantuan") ||
        command.includes("kamu bisa apa")
    ){

        response(
            "Saya bisa membuka WhatsApp, YouTube, Google, kamera, melakukan pencarian Google, membaca waktu, dan mencoba mengontrol senter jika perangkat mendukungnya."
        );

        return;
    }


    /* UNKNOWN COMMAND */

    response(
        "Maaf, saya belum memahami perintah tersebut."
    );
}


/* CAMERA */

async function openCamera(){

    try{

        stream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:"environment"
                }
            });

        videoTrack =
            stream.getVideoTracks()[0];

        const capabilities =
            videoTrack.getCapabilities();

        /*
        Kamera berhasil diakses.
        Browser akan meminta izin kamera.
        */

        if(capabilities.torch){

            response(
                "Kamera berhasil aktif. Perangkat mendukung kontrol senter."
            );

        }else{

            response(
                "Kamera berhasil aktif, tetapi browser tidak menyediakan kontrol senter."
            );
        }

    }catch(error){

        response(
            "Saya tidak bisa mengakses kamera. Pastikan izin kamera sudah diberikan."
        );

        console.log(error);
    }
}


/* FLASHLIGHT */

async function flashlight(state){

    try{

        /*
        Jika kamera belum aktif,
        kita minta akses kamera terlebih dahulu.
        */

        if(!videoTrack){

            stream =
                await navigator.mediaDevices.getUserMedia({
                    video:{
                        facingMode:"environment"
                    }
                });

            videoTrack =
                stream.getVideoTracks()[0];
        }

        const capabilities =
            videoTrack.getCapabilities();

        if(!capabilities.torch){

            response(
                "Maaf, browser atau perangkat ini tidak menyediakan kontrol senter melalui website."
            );

            return;
        }

        await videoTrack.applyConstraints({
            advanced:[
                {
                    torch:state
                }
            ]
        });

        if(state){

            response(
                "Senter berhasil dinyalakan."
            );

        }else{

            response(
                "Senter berhasil dimatikan."
            );
        }

    }catch(error){

        console.log(error);

        response(
            "Saya tidak bisa mengontrol senter dari browser ini. Pastikan izin kamera diberikan dan perangkat mendukung fitur tersebut."
        );
    }
}
</script>

</body>
</html>
