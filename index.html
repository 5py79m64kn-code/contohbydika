<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>PRATAMA AI ASSISTANT</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top,#172554 0%,#070b18 42%,#02040b 100%);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:15px;
}

.app{
    width:100%;
    max-width:450px;
    min-height:700px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:30px;
    padding:24px 20px;
    background:rgba(7,12,29,.94);
    box-shadow:
        0 0 60px rgba(0,140,255,.18),
        inset 0 0 30px rgba(255,255,255,.02);
    text-align:center;
}

.logo{
    width:88px;
    height:88px;
    margin:0 auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:42px;
    background:radial-gradient(circle,#2563eb,#111827 70%);
    box-shadow:0 0 35px rgba(37,99,235,.55);
}

h1{
    margin-top:16px;
    font-size:27px;
}

.powered{
    margin-top:6px;
    color:#64748b;
    font-size:11px;
}

.status{
    display:inline-block;
    margin-top:20px;
    padding:9px 15px;
    border-radius:30px;
    background:#111827;
    color:#60a5fa;
    font-size:13px;
}

.orb{
    width:190px;
    height:190px;
    margin:30px auto 22px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle,
        #3b82f6 0%,
        #1e3a8a 35%,
        #111827 70%);
    box-shadow:0 0 45px rgba(37,99,235,.35);
    transition:.25s;
}

.orb.active{
    animation:pulse 1.1s infinite;
    box-shadow:0 0 75px rgba(0,174,255,.75);
}

@keyframes pulse{
    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.08);
    }

    100%{
        transform:scale(1);
    }
}

.robot{
    font-size:70px;
}

.mainMic{
    width:78px;
    height:78px;
    border:none;
    border-radius:50%;
    background:#2563eb;
    color:white;
    font-size:30px;
    box-shadow:0 8px 30px rgba(37,99,235,.45);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
}

.mainMic:active{
    transform:scale(.92);
}

.testVoice{
    margin-top:12px;
    padding:11px 18px;
    border:none;
    border-radius:20px;
    background:#1e293b;
    color:#cbd5e1;
    cursor:pointer;
}

.card{
    margin-top:18px;
    text-align:left;
    padding:15px;
    border-radius:17px;
    background:#0f172a;
    border:1px solid rgba(255,255,255,.07);
}

.cardTitle{
    font-size:10px;
    color:#64748b;
    margin-bottom:7px;
    letter-spacing:1px;
}

.cardText{
    font-size:15px;
    line-height:1.5;
    color:#f8fafc;
    min-height:22px;
}

.commands{
    margin-top:18px;
    text-align:left;
}

.commandsTitle{
    color:#64748b;
    font-size:11px;
    margin-bottom:8px;
}

.commandBox{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
}

.command{
    background:#111827;
    color:#cbd5e1;
    padding:7px 9px;
    border-radius:9px;
    font-size:10px;
}

.error{
    color:#f87171 !important;
}
</style>
</head>

<body>

<div class="app">

    <div class="logo">
        🤖
    </div>

    <h1>PRATAMA AI</h1>

    <div class="powered">
        Voice Assistant • Powered by Pratama Andika Wiyoga
    </div>

    <div class="status" id="status">
        Siap mendengarkan
    </div>

    <div class="orb" id="orb">
        <div class="robot">
            🤖
        </div>
    </div>

    <button
        class="mainMic"
        id="micButton"
        type="button">
        🎤
    </button>

    <br>

    <button
        class="testVoice"
        id="testVoice"
        type="button">
        🔊 Tes Suara AI
    </button>

    <div class="card">

        <div class="cardTitle">
            PERINTAH ANDA
        </div>

        <div
            class="cardText"
            id="userText">
            Belum ada perintah...
        </div>

    </div>

    <div class="card">

        <div class="cardTitle">
            RESPONS AI
        </div>

        <div
            class="cardText"
            id="aiText">
            Halo, saya siap membantu.
        </div>

    </div>

    <div class="commands">

        <div class="commandsTitle">
            CONTOH PERINTAH
        </div>

        <div class="commandBox">

            <div class="command">
                Buka WhatsApp
            </div>

            <div class="command">
                Buka YouTube
            </div>

            <div class="command">
                Buka Google
            </div>

            <div class="command">
                Buka kamera
            </div>

            <div class="command">
                Nyalakan senter
            </div>

            <div class="command">
                Matikan senter
            </div>

            <div class="command">
                Jam berapa
            </div>

            <div class="command">
                Halo
            </div>

        </div>

    </div>

</div>


<script>

/* =========================================
   ELEMENT
========================================= */

const micButton =
    document.getElementById("micButton");

const testVoice =
    document.getElementById("testVoice");

const statusBox =
    document.getElementById("status");

const userText =
    document.getElementById("userText");

const aiText =
    document.getElementById("aiText");

const orb =
    document.getElementById("orb");


/* =========================================
   SPEECH RECOGNITION
========================================= */

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition = null;

let listening = false;


/* =========================================
   CHECK BROWSER
========================================= */

if(!SpeechRecognition){

    statusBox.innerText =
        "Browser tidak mendukung voice command";

    statusBox.classList.add("error");

    micButton.disabled = true;

}else{

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "id-ID";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;


    recognition.onstart = function(){

        listening = true;

        statusBox.innerText =
            "🎙️ Mendengarkan...";

        orb.classList.add("active");

        micButton.innerText =
            "⏹️";
    };


    recognition.onresult = function(event){

        try{

            const result =
                event.results[
                    event.results.length - 1
                ];

            const text =
                result[0].transcript
                    .trim()
                    .toLowerCase();

            if(!text){

                speak(
                    "Saya tidak mendengar perintah."
                );

                return;
            }

            userText.innerText =
                text;

            statusBox.innerText =
                "Perintah diterima";

            /*
             * Tunggu sebentar agar Safari
             * menyelesaikan event suara.
             */

            setTimeout(function(){

                processCommand(text);

            },150);

        }catch(error){

            console.log(error);

            setAI(
                "Maaf, terjadi kesalahan membaca suara."
            );

        }
    };


    recognition.onerror = function(event){

        console.log(
            "Speech error:",
            event.error
        );

        listening = false;

        orb.classList.remove("active");

        micButton.innerText =
            "🎤";

        if(event.error === "not-allowed"){

            statusBox.innerText =
                "Izin mikrofon ditolak";

            setAI(
                "Izin mikrofon belum diberikan. Silakan izinkan mikrofon pada browser."
            );

        }else if(event.error === "no-speech"){

            statusBox.innerText =
                "Tidak ada suara";

        }else{

            statusBox.innerText =
                "Gagal mengenali suara";
        }
    };


    recognition.onend = function(){

        listening = false;

        orb.classList.remove("active");

        micButton.innerText =
            "🎤";

        if(
            statusBox.innerText ===
            "🎙️ Mendengarkan..."
        ){

            statusBox.innerText =
                "Siap mendengarkan";
        }
    };
}


/* =========================================
   MICROPHONE BUTTON
========================================= */

micButton.addEventListener(
    "click",
    function(){

        if(!recognition){

            alert(
                "Browser ini tidak mendukung voice recognition."
            );

            return;
        }

        if(listening){

            try{

                recognition.stop();

            }catch(error){

                console.log(error);

            }

            return;
        }


        /*
         * Penting:
         * voice recognition dimulai
         * langsung dari klik user.
         */

        try{

            recognition.start();

        }catch(error){

            console.log(error);

            /*
             * Jika recognition masih dianggap aktif,
             * hentikan lalu mulai lagi.
             */

            try{

                recognition.stop();

            }catch(e){}

            setTimeout(function(){

                try{

                    recognition.start();

                }catch(e){

                    console.log(e);

                }

            },400);
        }

    }
);


/* =========================================
   TEXT TO SPEECH
========================================= */

function speak(text){

    /*
     * Jangan menggunakan banyak utterance
     * sekaligus.
     */

    if(
        !("speechSynthesis" in window)
    ){

        console.log(
            "Speech synthesis tidak tersedia."
        );

        return;
    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    utterance.lang =
        "id-ID";

    utterance.rate =
        0.95;

    utterance.pitch =
        1;

    utterance.volume =
        1;


    utterance.onstart =
        function(){

            statusBox.innerText =
                "🔊 AI sedang berbicara...";
        };


    utterance.onend =
        function(){

            statusBox.innerText =
                "Siap mendengarkan";
        };


    utterance.onerror =
        function(event){

            console.log(
                "TTS error:",
                event
            );

            statusBox.innerText =
                "Voice-over gagal";

        };


    /*
     * Safari kadang perlu utterance
     * dipanggil setelah event user.
     */

    window.speechSynthesis.speak(
        utterance
    );
}


/* =========================================
   TEST VOICE
========================================= */

testVoice.addEventListener(
    "click",
    function(){

        setAI(
            "Tes suara berhasil. Saya siap menerima perintah."
        );

        speak(
            "Tes suara berhasil. Saya siap menerima perintah."
        );

    }
);


/* =========================================
   AI RESPONSE
========================================= */

function setAI(text){

    aiText.innerText =
        text;

}


/* =========================================
   RESPONSE
========================================= */

function response(text){

    setAI(text);

    /*
     * Sedikit delay supaya
     * Safari tidak bentrok dengan
     * event recognition.
     */

    setTimeout(function(){

        speak(text);

    },200);
}


/* =========================================
   COMMAND PROCESSOR
========================================= */

async function processCommand(command){

    console.log(
        "COMMAND:",
        command
    );


    /* -------------------------
       HALO
    ------------------------- */

    if(
        command.includes("halo") ||
        command.includes("hai") ||
        command.includes("hello")
    ){

        response(
            "Halo! Saya Pratama AI. Ada yang bisa saya bantu?"
        );

        return;
    }


    /* -------------------------
       WHATSAPP
    ------------------------- */

    if(
        command.includes("buka whatsapp") ||
        command.includes("buka wa")
    ){

        response(
            "Baik, saya akan membuka WhatsApp."
        );

        setTimeout(function(){

            window.location.href =
                "whatsapp://";

        },1200);

        return;
    }


    /* -------------------------
       YOUTUBE
    ------------------------- */

    if(
        command.includes("buka youtube")
    ){

        response(
            "Baik, saya akan membuka YouTube."
        );

        setTimeout(function(){

            window.location.href =
                "https://youtube.com/";

        },1200);

        return;
    }


    /* -------------------------
       GOOGLE
    ------------------------- */

    if(
        command.includes("buka google")
    ){

        response(
            "Baik, saya akan membuka Google."
        );

        setTimeout(function(){

            window.location.href =
                "https://google.com/";

        },1200);

        return;
    }


    /* -------------------------
       SEARCH
    ------------------------- */

    if(
        command.startsWith("cari ")
    ){

        const query =
            command
                .replace("cari ","")
                .trim();

        if(query){

            response(
                "Baik, saya akan mencari " +
                query
            );

            setTimeout(function(){

                window.location.href =
                    "https://www.google.com/search?q=" +
                    encodeURIComponent(query);

            },1200);

            return;
        }
    }


    /* -------------------------
       JAM
    ------------------------- */

    if(
        command.includes("jam berapa") ||
        command.includes("jam sekarang") ||
        command.includes("waktu sekarang")
    ){

        const now =
            new Date();

        const time =
            now.toLocaleTimeString(
                "id-ID",
                {
                    hour:"2-digit",
                    minute:"2-digit"
                }
            );

        response(
            "Sekarang pukul " +
            time
        );

        return;
    }


    /* -------------------------
       KAMERA
    ------------------------- */

    if(
        command.includes("buka kamera") ||
        command.includes("nyalakan kamera")
    ){

        response(
            "Baik, saya akan meminta akses kamera."
        );

        openCamera();

        return;
    }


    /* -------------------------
       SENTER
    ------------------------- */

    if(
        command.includes("nyalakan senter") ||
        command.includes("hidupkan senter") ||
        command.includes("senter nyala")
    ){

        response(
            "Baik, saya mencoba menyalakan senter."
        );

        await flashlight(true);

        return;
    }


    if(
        command.includes("matikan senter") ||
        command.includes("padamkan senter") ||
        command.includes("senter mati")
    ){

        response(
            "Baik, saya mencoba mematikan senter."
        );

        await flashlight(false);

        return;
    }


    /* -------------------------
       BANTUAN
    ------------------------- */

    if(
        command.includes("bantuan") ||
        command.includes("kamu bisa apa")
    ){

        response(
            "Saya bisa membuka WhatsApp, YouTube, Google, mencari sesuatu di Google, membuka kamera, membaca waktu, dan mencoba mengontrol senter jika browser mendukungnya."
        );

        return;
    }


    /* -------------------------
       UNKNOWN
    ------------------------- */

    response(
        "Saya mendengar perintah " +
        command +
        ", tetapi saya belum memiliki fungsi untuk perintah tersebut."
    );
}


/* =========================================
   CAMERA
========================================= */

let cameraStream = null;
let cameraTrack = null;


async function openCamera(){

    try{

        if(!navigator.mediaDevices){

            response(
                "Browser ini tidak menyediakan akses kamera."
            );

            return;
        }


        cameraStream =
            await navigator.mediaDevices.getUserMedia({
                video:{
                    facingMode:{
                        ideal:"environment"
                    }
                },
                audio:false
            });


        cameraTrack =
            cameraStream.getVideoTracks()[0];


        response(
            "Kamera berhasil mendapatkan izin."
        );


        /*
         * Kita tidak menampilkan video
         * karena fungsi utama halaman ini
         * adalah voice assistant.
         */

        console.log(
            "Camera track:",
            cameraTrack
        );

    }catch(error){

        console.log(
            "Camera error:",
            error
        );

        response(
            "Saya tidak bisa mengakses kamera. Silakan izinkan akses kamera pada browser."
        );
    }
}


/* =========================================
   FLASHLIGHT
========================================= */

async function flashlight(state){

    try{

        /*
         * Untuk mencoba flashlight,
         * kamera harus memiliki track aktif.
         */

        if(!cameraTrack){

            cameraStream =
                await navigator.mediaDevices.getUserMedia({
                    video:{
                        facingMode:{
                            ideal:"environment"
                        }
                    },
                    audio:false
                });

            cameraTrack =
                cameraStream.getVideoTracks()[0];
        }


        const capabilities =
            cameraTrack.getCapabilities();


        if(
            !capabilities ||
            !capabilities.torch
        ){

            response(
                "Browser ini tidak mengizinkan website mengontrol senter perangkat."
            );

            return;
        }


        await cameraTrack.applyConstraints({
            advanced:[
                {
                    torch:state
                }
            ]
        });


        if(state){

            response(
                "Senter berhasil dinyalakan."
            );

        }else{

            response(
                "Senter berhasil dimatikan."
            );
        }


    }catch(error){

        console.log(
            "Flashlight error:",
            error
        );

        response(
            "Senter tidak dapat dikontrol melalui browser pada perangkat ini."
        );
    }
}


/* =========================================
   PAGE LOAD
========================================= */

window.addEventListener(
    "load",
    function(){

        /*
         * Jangan langsung menjalankan speech
         * saat halaman dibuka karena Safari
         * dapat memblokir audio otomatis.
         */

        console.log(
            "PRATAMA AI siap."
        );

    }
);

</script>

</body>
</html>
